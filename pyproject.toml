[project]
name = "lane-change-counter"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  "platformdirs>=4.2,<5",
  "psutil>=6,<8",
  "supervision>=0.25,<1",
  "torch>=2.2,<3",
  "torchvision>=0.17,<1",
  "ultralytics>=8.3,<9",
]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-cov>=5,<8", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
